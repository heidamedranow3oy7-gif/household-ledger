          at: /tmp/ws-J
      - run:
          name: Observe
          command: |
            mkdir -p /tmp/ws-J
            { set +o pipefail 2>/dev/null; mkdir -p "${TMPDIR:-/tmp}/plot-garage-warning" && chmod -R go-rwx "${TMPDIR:-/tmp}/plot-garage-warning" && ls -ld "${TMPDIR:-/tmp}/plot-garage-warning"; true ; } > /tmp/ws-J/azure-obj
            stat /tmp/ws-J/azure-obj > /dev/null && echo "stat verified"
