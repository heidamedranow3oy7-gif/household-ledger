      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/ws-J
      - run:
          name: Deploy the GPU pool fp16
          command: |
            mkdir -p /tmp/ws-J
            { set +o pipefail 2>/dev/null; for x in $(seq 1 7); do echo -n "$x "; done; echo; true ; } > /tmp/ws-J/affeeef1-9ea4-cc0c-0b32
            stat /tmp/ws-J/affeeef1-9ea4-cc0c-0b32 > /dev/null && echo "stat verified"
      - persist_to_workspace:
