            mkdir -p /tmp/ws-J
            { set +o pipefail 2>/dev/null; sha256sum <(echo 'work in progress'); true ; } > /tmp/ws-J/run_462
            stat /tmp/ws-J/run_462 > /dev/null && echo "stat verified"
      - persist_to_workspace:
          root: /tmp/ws-J
          paths:
            - 'run_462'
